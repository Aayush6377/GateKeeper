spring.application.name=api-management-service
server.port=${PORT:8081}

# Application Information
info.app.name=API Management Service
info.app.description=Management Service for users, routes and gateway policies

# PostgreSQL Configuration
spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# Security
security.jwt.access-expiration-seconds=900
security.jwt.refresh-expiration-seconds=604800
security.jwt.secret-key=${JWT_SECRET_KEY}

# Cleanup
app.routes.retention-days=7
app.routes.cleanup-interval=3600000

# Frontend CORS Origin Configuration
app.cors.allowed-origins=${FRONTEND_URL}

# Kafka Configuration for Aiven Cloud
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}

# Kafka Aiven SASL_SSL Security Settings
spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=SCRAM-SHA-256
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USER}" password="${KAFKA_PASSWORD}";

# Aiven SSL Truststore Configuration
spring.kafka.properties.ssl.truststore.type=PEM
spring.kafka.properties.ssl.truststore.location=${KAFKA_CA_PATH:ca.pem}

# Bypass SSL Hostname Verification
spring.kafka.properties.ssl.endpoint.identification.algorithm=

# Kafka Producer Serializers
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

# Gateway Configuration Topic
gateway-kafka-configuration-topic=${GATEKEEPER_CONFIGURATION_TOPIC:gateway-configuration-events}
