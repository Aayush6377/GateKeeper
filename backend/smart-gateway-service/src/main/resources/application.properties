# Application Configuration
spring.application.name=smart-gateway-service
server.port=${PORT:8080}
server.max-http-request-header-size=65536
server.tomcat.max-http-response-header-size=65536

# Application Information
info.app.name=Smart Gateway Service
info.app.description=Custom API gateway for routing, security and traffic management

# API Management Service
management-api-base-url=${GATEKEEPER_MANAGEMENT_URL:http://localhost:8081}
management-api-username=${GATEKEEPER_GATEWAY_USERNAME}
management-api-password=${GATEKEEPER_GATEWAY_PASSWORD}

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}

# Kafka Aiven SASL_SSL Security Settings
spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=SCRAM-SHA-256
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USER}" password="${KAFKA_PASSWORD}";

# Aiven SSL Truststore Configuration
spring.kafka.properties.ssl.truststore.type=PEM
spring.kafka.properties.ssl.truststore.location=${KAFKA_CA_PATH:ca.pem}

# Bypass SSL Hostname Verification
spring.kafka.properties.ssl.endpoint.identification.algorithm=

# Gateway Configuration Topic
gateway-kafka-configuration-topic=${GATEKEEPER_CONFIGURATION_TOPIC:gateway-configuration-events}
gateway-kafka-configuration-group=${GATEKEEPER_CONFIGURATION_GROUP:smart-gateway-configuration}

# Custom Topic for Access Events
gateway.kafka.access-events-topic=${GATEKEEPER_ACCESS_EVENTS_TOPIC:gateway-access-events}

# Kafka Consumer
spring.kafka.consumer.group-id=${gateway-kafka-configuration-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=manual

# Kafka Producer Configuration for Access Events
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

# Upstash Redis Configuration
spring.data.redis.url=redis://localhost:6379

# Frontend CORS Origin Configuration
app.cors.allowed-origins=${FRONTEND_URL}