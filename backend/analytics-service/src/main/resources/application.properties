spring.application.name=analytics-service
server.port=${PORT:8082}

info.app.name=Analytics Service
info.app.description=Access-event storage and API usage analytics

spring.data.mongodb.uri=${MONGODB_URL}

# JWT Secret Key
security.jwt.secret-key=${JWT_SECRET_KEY}

# Frontend CORS Origin Configuration
app.cors.allowed-origins=${FRONTEND_URL}

management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.prometheus.enabled=true

# Custom Topic for Access Events
gateway.kafka.access-events-topic=${GATEKEEPER_ACCESS_EVENTS_TOPIC:gateway-access-events}
gateway.kafka.access-events-group=${GATEKEEPER_ACCESS_EVENTS_GROUP:analytics-access-events-group}

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}

# Kafka Aiven SASL_SSL Security Settings
spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=SCRAM-SHA-256
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USER}" password="${KAFKA_PASSWORD}";

# Aiven SSL Truststore Configuration
spring.kafka.properties.ssl.truststore.type=PEM
spring.kafka.properties.ssl.truststore.location=${KAFKA_CA_PATH:ca.pem}

# Bypass SSL Hostname Verification
spring.kafka.properties.ssl.endpoint.identification.algorithm=

# Kafka Consumer Configuration
spring.kafka.consumer.group-id=${gateway.kafka.access-events-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.listener.ack-mode=manual